[project]
name = "reve-labs-pulse-body"
version = "0.1.0"
description = "A local audio-reactive particle-body video renderer."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "Flask>=3.0,<4",
  "numpy>=1.24,<3",
  "Pillow>=10,<12"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["app", "render_pulse_body"]
